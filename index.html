<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UniMap</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ==================== PANTALLA DE ACCESO ==================== -->
    <div id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="logo-mark">U</span>
                <h1>UniMap</h1>
                <p>Mapa 3D interactivo de oficinas</p>
            </div>

            <div id="auth-options" class="auth-options">
                <button class="btn btn-primary" id="btn-login">Iniciar sesión</button>
                <button class="btn btn-secondary" id="btn-register">Crear cuenta</button>
                <button class="btn btn-ghost" id="btn-guest">Continuar como invitado</button>
            </div>

            <form id="login-form" class="auth-form hidden">
                <h2>Iniciar sesión</h2>
                <div class="form-group">
                    <label for="login-email">Correo electrónico</label>
                    <input type="email" id="login-email" placeholder="tu@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <p id="login-error" class="form-error hidden"></p>
                <button type="submit" class="btn btn-primary">Entrar</button>
                <button type="button" class="btn btn-ghost back-btn">← Volver</button>
            </form>

            <form id="register-form" class="auth-form hidden">
                <h2>Crear cuenta</h2>
                <div class="form-group">
                    <label for="reg-name">Nombre completo</label>
                    <input type="text" id="reg-name" placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Correo electrónico</label>
                    <input type="email" id="reg-email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="reg-confirm">Confirmar contraseña</label>
                    <input type="password" id="reg-confirm" placeholder="Repite la contraseña" required>
                </div>
                <p id="register-error" class="form-error hidden"></p>
                <button type="submit" class="btn btn-primary">Crear cuenta</button>
                <button type="button" class="btn btn-ghost back-btn">← Volver</button>
            </form>
        </div>
    </div>

    <!-- ==================== APLICACIÓN PRINCIPAL ==================== -->
    <div id="app" class="app hidden">

        <header class="header">
            <div class="header-left">
                <button id="btn-menu" class="btn-icon menu-btn" aria-label="Menú">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="logo">
                    <span class="logo-mark">U</span>
                    <span class="logo-text">UniMap</span>
                </div>
            </div>

            <div class="header-right">
                <span id="user-info" class="user-info"></span>
                <button id="btn-logout" class="btn-icon" title="Cerrar sesión" aria-label="Cerrar sesión">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <main class="main">
            <!-- Overlay móvil para cerrar sidebar -->
            <div id="sidebar-overlay" class="sidebar-overlay"></div>

            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h2>Explorar</h2>
                    <button id="btn-close-sidebar" class="btn-icon close-sidebar" aria-label="Cerrar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <!-- Búsqueda -->
                <div class="search-box">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="search" id="search-input" placeholder="Buscar oficina, persona..." autocomplete="off">
                    <button id="btn-clear-search" class="clear-search hidden" aria-label="Limpiar">×</button>
                </div>

                <!-- Resultados de búsqueda -->
                <div id="search-results" class="search-results hidden"></div>

                <!-- Lista de pisos -->
                <div class="sidebar-section">
                    <p class="section-label">Pisos</p>
                    <div class="floor-list" id="floor-list"></div>
                </div>

                <div class="sidebar-footer">
                    <div class="controls-hint">
                        <div><strong>Arrastrar</strong> Rotar</div>
                        <div><strong>Pellizcar / Rueda</strong> Zoom</div>
                        <div><strong>Dos dedos</strong> Pan</div>
                    </div>
                </div>
            </aside>

            <!-- Visor 3D -->
            <section class="viewer-section">
                <div class="viewer-container">
                    <canvas id="viewer"></canvas>

                    <div class="viewer-overlay">
                        <div class="viewer-label" id="current-floor-label">Piso 1</div>
                        <div class="loading" id="loading">
                            <div class="spinner"></div>
                            <span>Cargando modelo 3D...</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Panel de información (hotspot / oficina) -->
        <div id="info-panel" class="info-panel hidden">
            <div class="info-panel-handle"></div>
            <button id="btn-close-info" class="btn-icon close-info" aria-label="Cerrar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="info-content">
                <span class="info-badge" id="info-floor">Piso 1</span>
                <h3 id="info-title">Nombre de la oficina</h3>
                <p id="info-desc">Descripción breve de la oficina o zona.</p>
                <div class="info-meta" id="info-meta"></div>
                <button class="btn btn-primary btn-sm" id="btn-focus-office">Enfocar en mapa</button>
            </div>
        </div>
    </div>

    <!-- THREE.JS -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
