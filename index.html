<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UniMap – Campus 3D</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: {
              950: '#0a0c10',
              900: '#11151c',
              800: '#151a22',
              700: '#1e2530',
              600: '#2a3341',
            },
            accent: {
              DEFAULT: '#00d4ff',
              hover: '#33ddff',
              dim: 'rgba(0, 212, 255, 0.12)',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Solo lo mínimo que Tailwind no cubre bien */
    body { overscroll-behavior: none; }
    .hotspot-label {
      color: #00d4ff;
      font-size: 11px;
      font-weight: 500;
      background: rgba(10,12,16,0.9);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(0,212,255,0.35);
      white-space: nowrap;
      pointer-events: none;
      transform: translateY(-18px);
    }
    #viewer { touch-action: none; }
  </style>
</head>
<body class="bg-dark-950 text-slate-100 font-sans antialiased min-h-screen overflow-x-hidden">

  <!-- ==================== AUTH ==================== -->
  <div id="auth-screen" class="min-h-screen min-h-[100dvh] flex items-center justify-center p-5
    bg-[radial-gradient(ellipse_at_30%_20%,rgba(0,212,255,0.06)_0%,transparent_50%),radial-gradient(ellipse_at_70%_80%,rgba(0,212,255,0.04)_0%,transparent_50%),#0a0c10]">
    
    <div class="w-full max-w-sm bg-dark-800 border border-dark-700 rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-accent text-dark-950 font-bold text-xl rounded-xl mb-3">U</div>
        <h1 class="text-2xl font-semibold tracking-tight">UniMap</h1>
        <p class="text-slate-400 text-sm mt-1">Mapa 3D del campus universitario</p>
      </div>

      <!-- Opciones iniciales -->
      <div id="auth-options" class="flex flex-col gap-3">
        <button id="btn-login" class="btn-primary">Iniciar sesión</button>
        <button id="btn-register" class="btn-secondary">Crear cuenta</button>
        <button id="btn-guest" class="btn-ghost">Continuar como invitado</button>
      </div>

      <!-- Login -->
      <form id="login-form" class="hidden flex flex-col gap-4">
        <h2 class="text-lg font-semibold">Iniciar sesión</h2>
        <div>
          <label class="text-xs text-slate-400 font-medium">Correo electrónico</label>
          <input type="email" id="login-email" required autocomplete="email"
            class="input-field" placeholder="tu@email.com" />
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">Contraseña</label>
          <input type="password" id="login-password" required autocomplete="current-password"
            class="input-field" placeholder="••••••••" />
        </div>
        <p id="login-error" class="text-red-400 text-sm hidden"></p>
        <button type="submit" class="btn-primary">Entrar</button>
        <button type="button" class="btn-ghost back-btn">← Volver</button>
      </form>

      <!-- Registro -->
      <form id="register-form" class="hidden flex flex-col gap-4">
        <h2 class="text-lg font-semibold">Crear cuenta</h2>
        <div>
          <label class="text-xs text-slate-400 font-medium">Nombre completo</label>
          <input type="text" id="reg-name" required class="input-field" placeholder="Tu nombre" />
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">Correo electrónico</label>
          <input type="email" id="reg-email" required class="input-field" placeholder="tu@email.com" />
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">Contraseña</label>
          <input type="password" id="reg-password" minlength="6" required class="input-field" placeholder="Mínimo 6 caracteres" />
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">Confirmar contraseña</label>
          <input type="password" id="reg-confirm" required class="input-field" placeholder="Repite la contraseña" />
        </div>
        <p id="register-error" class="text-red-400 text-sm hidden"></p>
        <button type="submit" class="btn-primary">Crear cuenta</button>
        <button type="button" class="btn-ghost back-btn">← Volver</button>
      </form>
    </div>
  </div>

  <!-- ==================== SELECTOR DE TORRE ==================== -->
  <div id="tower-screen" class="hidden min-h-screen min-h-[100dvh] flex items-center justify-center p-5
    bg-[radial-gradient(ellipse_at_30%_20%,rgba(0,212,255,0.06)_0%,transparent_50%),#0a0c10]">
    
    <div class="w-full max-w-md">
      <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-accent text-dark-950 font-bold text-xl rounded-xl mb-3">U</div>
        <h1 class="text-2xl font-semibold">Elige una torre</h1>
        <p class="text-slate-400 text-sm mt-1">Selecciona el edificio que quieres explorar</p>
      </div>

      <div class="grid gap-4">
        <button id="btn-innovacion" class="tower-card group">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-xl bg-accent/10 border border-accent/30 flex items-center justify-center text-accent text-2xl font-bold group-hover:bg-accent group-hover:text-dark-950 transition">I</div>
            <div class="text-left">
              <h3 class="font-semibold text-lg">Torre Innovación</h3>
              <p class="text-slate-400 text-sm">13 pisos · Oficinas modernas</p>
            </div>
          </div>
        </button>

        <button id="btn-antigua" class="tower-card group">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-2xl font-bold group-hover:bg-amber-500 group-hover:text-dark-950 transition">A</div>
            <div class="text-left">
              <h3 class="font-semibold text-lg">Torre Antigua</h3>
              <p class="text-slate-400 text-sm">17 pisos · Baños / Cursos / Conexión</p>
            </div>
          </div>
        </button>
      </div>

      <button id="btn-logout-tower" class="mt-8 w-full btn-ghost text-sm">Cerrar sesión</button>
    </div>
  </div>

  <!-- ==================== APP PRINCIPAL ==================== -->
  <div id="app" class="hidden min-h-screen min-h-[100dvh] flex flex-col">

    <!-- Header -->
    <header class="h-14 md:h-[60px] flex items-center justify-between px-3 md:px-5 border-b border-dark-700 bg-dark-950/90 backdrop-blur-md sticky top-0 z-50">
      <div class="flex items-center gap-2">
        <button id="btn-menu" class="btn-icon md:hidden" aria-label="Menú">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="flex items-center gap-2 font-semibold text-sm tracking-tight">
          <span class="w-8 h-8 bg-accent text-dark-950 font-bold text-sm rounded-lg flex items-center justify-center">U</span>
          <span class="hidden sm:inline">UniMap</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span id="tower-badge" class="text-xs px-2.5 py-1 rounded-full bg-accent/10 text-accent border border-accent/20"></span>
        <span id="user-info" class="text-xs text-slate-400 max-w-[100px] md:max-w-[160px] truncate"></span>
        <button id="btn-change-tower" class="btn-icon" title="Cambiar torre" aria-label="Cambiar torre">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </button>
        <button id="btn-logout" class="btn-icon" title="Cerrar sesión">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="flex-1 flex relative">
      <!-- Overlay móvil -->
      <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 opacity-0 pointer-events-none transition-opacity md:hidden"></div>

      <!-- Sidebar -->
      <aside id="sidebar" class="fixed md:relative left-0 top-14 md:top-0 bottom-0 w-[280px] max-w-[85vw] bg-dark-900 border-r border-dark-700 flex flex-col z-50
        -translate-x-full md:translate-x-0 transition-transform duration-300 ease-out">
        
        <div class="p-4 border-b border-dark-700 flex items-center justify-between md:hidden">
          <h2 class="font-semibold text-sm">Explorar</h2>
          <button id="btn-close-sidebar" class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- Búsqueda -->
        <div class="p-3 relative">
          <svg class="absolute left-6 top-1/2 -translate-y-1/2 text-slate-500" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="search" id="search-input" placeholder="Buscar oficina, persona..."
            class="w-full bg-dark-950 border border-dark-700 rounded-lg pl-10 pr-9 py-2.5 text-sm focus:outline-none focus:border-accent transition" />
          <button id="btn-clear-search" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-500 text-xl hidden">×</button>
        </div>

        <div id="search-results" class="hidden max-h-52 overflow-y-auto px-3 pb-2 border-b border-dark-700"></div>

        <div class="flex-1 overflow-hidden flex flex-col min-h-0">
          <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 px-4 pt-3 pb-1">Pisos</p>
          <div id="floor-list" class="flex-1 overflow-y-auto px-3 pb-4 space-y-1"></div>
        </div>

        <div class="p-4 border-t border-dark-700 text-[11px] text-slate-500 space-y-1">
          <div><strong class="text-slate-300">Arrastrar</strong> Rotar</div>
          <div><strong class="text-slate-300">Pellizcar / Rueda</strong> Zoom</div>
          <div><strong class="text-slate-300">Dos dedos</strong> Pan</div>
        </div>
      </aside>

      <!-- Viewer -->
      <section class="flex-1 relative bg-dark-950">
        <div class="relative w-full h-[calc(100vh-56px)] md:h-[calc(100vh-60px)] h-[calc(100dvh-56px)]">
          <canvas id="viewer" class="w-full h-full block"></canvas>

          <div class="absolute inset-0 pointer-events-none">
            <div id="current-floor-label" class="absolute top-3 left-3 px-3 py-1.5 text-xs font-medium tracking-wide
              bg-dark-950/80 backdrop-blur border border-dark-700 rounded-lg text-accent">
              Piso 1
            </div>

            <div id="loading" class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-dark-950/90 text-slate-400 text-sm pointer-events-auto">
              <div class="w-9 h-9 border-3 border-dark-700 border-t-accent rounded-full animate-spin"></div>
              <span>Cargando modelo 3D...</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Info Panel -->
    <div id="info-panel" class="fixed left-0 right-0 bottom-0 md:left-auto md:right-5 md:bottom-5 md:w-80
      bg-dark-800 border-t md:border border-dark-700 rounded-t-2xl md:rounded-xl p-5 pt-3 z-50
      translate-y-full md:translate-x-[120%] md:translate-y-0 transition-transform duration-300 max-h-[55vh] md:max-h-[70vh] overflow-y-auto shadow-2xl hidden">
      
      <div class="w-9 h-1 bg-dark-600 rounded-full mx-auto mb-3 md:hidden"></div>
      <button id="btn-close-info" class="absolute top-3 right-3 btn-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <div class="pr-8">
        <span id="info-floor" class="inline-block text-[11px] font-semibold tracking-wide text-accent bg-accent/10 px-2.5 py-1 rounded-full mb-2">Piso 1</span>
        <h3 id="info-title" class="text-lg font-semibold mb-1.5">Nombre</h3>
        <p id="info-desc" class="text-sm text-slate-400 leading-relaxed mb-3">Descripción</p>
        <div id="info-meta" class="flex flex-wrap gap-2 mb-4"></div>
        <button id="btn-focus-office" class="btn-primary text-sm py-2.5">Enfocar en mapa</button>
      </div>
    </div>
  </div>

  <!-- Clases utilitarias reutilizables -->
  <style>
    .btn-primary {
      @apply w-full py-3 px-5 rounded-lg bg-accent text-dark-950 font-medium text-sm
             hover:bg-accent-hover transition min-h-[44px] flex items-center justify-center;
    }
    .btn-secondary {
      @apply w-full py-3 px-5 rounded-lg bg-accent/10 text-accent border border-accent/25 font-medium text-sm
             hover:bg-accent/20 transition min-h-[44px] flex items-center justify-center;
    }
    .btn-ghost {
      @apply w-full py-3 px-5 rounded-lg text-slate-400 font-medium text-sm
             hover:text-slate-100 transition min-h-[44px] flex items-center justify-center;
    }
    .btn-icon {
      @apply w-10 h-10 flex items-center justify-center rounded-lg border border-dark-700 text-slate-400
             hover:border-dark-600 hover:text-slate-100 transition shrink-0;
    }
    .input-field {
      @apply w-full mt-1 bg-dark-950 border border-dark-700 rounded-lg px-3.5 py-3 text-sm
             focus:outline-none focus:border-accent transition placeholder:text-slate-600;
    }
    .tower-card {
      @apply w-full p-5 rounded-2xl bg-dark-800 border border-dark-700
             hover:border-accent/40 hover:bg-dark-800/80 transition text-left;
    }
  </style>

  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
